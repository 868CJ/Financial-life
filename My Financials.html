            for (let key in categoryEmojis) {

            return '📁';

        // --- SORTING & BULK ACTION HELPERS ---
        function sortTransactionsList(txArray, config) {
            return [...txArray].sort((a, b) => {
                let valA, valB;
                if (config.key === 'amount') {
                    valA = parseFloat(a.amount) || 0;
                    valB = parseFloat(b.amount) || 0;
                } else if (config.key === 'date') {
                    valA = a.date;
                    valB = b.date;
                } else if (config.key === 'account') {
                    valA = (a.account || '').toLowerCase();
                    valB = (b.account || '').toLowerCase();
                } else {
                    valA = String(a[config.key] || '').toLowerCase();
                    valB = String(b[config.key] || '').toLowerCase();
                }
                
                if (valA < valB) return config.dir === 'asc' ? -1 : 1;
                if (valA > valB) return config.dir === 'asc' ? 1 : -1;
                return 0;
            });
        }

        function setTxListSort(key) {
            if (txListSort.key === key) txListSort.dir = txListSort.dir === 'asc' ? 'desc' : 'asc';
            else { txListSort.key = key; txListSort.dir = 'desc'; }
            renderApp();
        }

        function setAiListSort(key) {
            if (aiListSort.key === key) aiListSort.dir = aiListSort.dir === 'asc' ? 'desc' : 'asc';
            else { aiListSort.key = key; aiListSort.dir = 'desc'; }
            runSmartAiQuery(currentAiQueryText, true);
        }

        function toggleTxSelection(id) {
            if (selectedTransactionIds.has(id)) selectedTransactionIds.delete(id);
            else selectedTransactionIds.add(id);
            updateBulkDeleteUI();
        }

        function selectAllTx(checkbox) {
            const checkboxes = document.querySelectorAll('.tx-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = checkbox.checked;
                if (checkbox.checked) selectedTransactionIds.add(cb.value);
                else selectedTransactionIds.delete(cb.value);
            });
            updateBulkDeleteUI();
        }

        function updateBulkDeleteUI() {
            document.querySelectorAll('.bulk-delete-btn').forEach(btn => {
                if (selectedTransactionIds.size > 0) btn.classList.remove('hidden');
                else btn.classList.add('hidden');
            });
            document.querySelectorAll('.bulk-delete-count').forEach(span => {
                span.textContent = selectedTransactionIds.size;
            });
        }

            if (selectedTransactionIds.size === 0) return;
            if (confirm(`Are you sure you want to delete ${selectedTransactionIds.size} selected transaction(s)?`)) {

                saveState();

        function saveState() {
            currentState.lastUpdated = new Date().toISOString();
            localStorage.setItem('my_financial_life_state', JSON.stringify(currentState));
        }

        function loadState() {
            const saved = localStorage.getItem('my_financial_life_state');
            if (saved) { try { currentState = JSON.parse(saved); } catch(e) { loadDemoData(); } } else { loadDemoData(); }
            
            if (currentState.transactions && currentState.transactions.length > 0) {
                currentState.transactions = currentState.transactions.filter(t => t.date);
            }
            if (!currentState.googleSheetUrl) currentState.googleSheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQqoOOrAswe6lI8fTUeKeIrbwBZzimtWZJO_iuVEexxL4T-zs378TKTMFaVLdYBrHfcFONqPMP_ZR8_/pub?output=csv';
            if (!currentState.netWorthHistory) currentState.netWorthHistory = [];
            if (!currentState.hiddenTabs) currentState.hiddenTabs = [];
            
            if (!currentState.tabOrder || currentState.tabOrder.length === 0) {
                currentState.tabOrder = ALL_PAGES.map(p => p.id);
            } else {
                const existingIds = new Set(currentState.tabOrder);
                ALL_PAGES.forEach(p => {
                    if (!existingIds.has(p.id)) currentState.tabOrder.push(p.id);
                });
            }

            setLatestMonth();
            if (currentState.darkMode) document.documentElement.classList.add('dark');
            updateUserBranding();
        }

        function setLatestMonth() {
            const months = getAvailableMonths();
            if (months.length > 0) {
                if (!globalSelectedMonth || !months.includes(globalSelectedMonth)) {
                    globalSelectedMonth = months[months.length - 1];
                }
            } else {
                globalSelectedMonth = new Date().toISOString().substring(0, 7);
            }
        }

        function getAvailableMonths() {
            const setOfMonths = new Set();
            (currentState.transactions || []).forEach(t => {
                if (t.date && t.date.length >= 7) {
                    setOfMonths.add(t.date.substring(0, 7));
                }
            });
            return Array.from(setOfMonths).sort();
        }

        function changeMonth(offset) {
            if (typeof selectedTransactionIds !== 'undefined') selectedTransactionIds.clear();
            const months = getAvailableMonths();
            if (months.length === 0) return;
            let idx = months.indexOf(globalSelectedMonth);
            if (idx === -1) idx = months.length - 1;
            idx += offset;
            if (idx < 0) idx = 0;
            if (idx >= months.length) idx = months.length - 1;
            globalSelectedMonth = months[idx];
            renderApp();
        }

        function formatMonthString(val) {
            if (!val || typeof val !== 'string' || !val.includes('-')) return val || '';
            const parts = val.split('-');
            if (parts.length < 2) return val;
            const year = parts[0];
            const month = parts[1];
            const date = new Date(parseInt(year), parseInt(month) - 1, 1);
            if (isNaN(date.getTime())) return val;
            return date.toLocaleString('default', { month: 'short', year: 'numeric' });
        }

            const titleStr = `${currentState.userName || 'Curtis'}'s Financial Life`;

            const past6Months = currentIdx >= 0 ? allMonths.slice(Math.max(0, currentIdx - 6), currentIdx) : [];
            const currentTx = currentState.transactions.filter(t => (t.date || '').startsWith(globalSelectedMonth) && t.type === 'Expense');
            const pastTx = currentState.transactions.filter(t => {
                const m = (t.date || '').substring(0, 7);
                return past6Months.includes(m) && t.type === 'Expense';
            });

            const currentCats = {};
            currentTx.forEach(t => { currentCats[t.category] = (currentCats[t.category] || 0) + t.amount; });
            const pastCats = {};
            pastTx.forEach(t => { pastCats[t.category] = (pastCats[t.category] || 0) + t.amount; });
            
            const numPastMonths = past6Months.length || 1;
            
            let alertsHtml = '';
            let hasAlerts = false;
            
            if (numPastMonths > 0) {
                const varianceData = Object.keys(currentCats).map(cat => {
                    const currentAmt = currentCats[cat];
                    const avgAmt = (pastCats[cat] || 0) / numPastMonths;
                    const diffPct = avgAmt > 0 ? ((currentAmt - avgAmt) / avgAmt) * 100 : (currentAmt > 0 ? 100 : 0);
                    return { cat, currentAmt, avgAmt, diffPct };
                }).filter(d => d.avgAmt > 50).sort((a, b) => b.diffPct - a.diffPct);

                alertsHtml = varianceData.map(d => {
                    const isAlert = d.diffPct > 10;

                    return `
                        <div class="flex items-center justify-between p-3 rounded-xl border ${isAlert ? 'bg-rose-50 dark:bg-rose-950/30 border-rose-200 dark:border-rose-900/50' : 'bg-mint-50 dark:bg-emerald-950/20 border-mint-200 dark:border-emerald-900/30'}">

        function initWaterfallChart() {
            const ctx = document.getElementById('waterfall-chart');
            if(!ctx) return;
            
            const currentTx = currentState.transactions.filter(t => (t.date || '').startsWith(globalSelectedMonth));
            const totalIncome = currentTx.filter(t => t.type === 'Income').reduce((s, t) => s + t.amount, 0);
            
            const expCats = {};
            currentTx.filter(t => t.type === 'Expense').forEach(t => {
                expCats[t.category] = (expCats[t.category] || 0) + t.amount;
            });
            
            const sortedExp = Object.entries(expCats).sort((a,b) => b[1] - a[1]);
            const topExps = sortedExp.slice(0, 4);
            const otherExpsAmount = sortedExp.slice(4).reduce((s, c) => s + c[1], 0);
            
            const labels = ['Gross Income'];
            const data = [[0, totalIncome]];
            const bgColors = [waterfallColors.positive];
            
            let currentY = totalIncome;
            
            topExps.forEach(exp => {
                if(exp[1] <= 0) return;
                const endY = currentY - exp[1];
                labels.push(exp[0].substring(0, 12) + (exp[0].length > 12 ? '...' : ''));
                data.push([endY, currentY]);
                bgColors.push(waterfallColors.negative);
                currentY = endY;
            });

            if (otherExpsAmount > 0) {
                const endY = currentY - otherExpsAmount;
                labels.push('Other Exps');
                data.push([endY, currentY]);
                bgColors.push(waterfallColors.negative);
                currentY = endY;
            }

            labels.push('Net Savings');
            data.push([0, currentY]);
            bgColors.push(currentY >= 0 ? waterfallColors.total : waterfallColors.negative);

            if (waterfallChartInstance) waterfallChartInstance.destroy();
            
            waterfallChartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ data: data, backgroundColor: bgColors, borderRadius: 4, borderSkipped: false }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(ctx) { const val = Array.isArray(ctx.raw) ? Math.abs(ctx.raw[1] - ctx.raw[0]) : ctx.raw; return formatMoney(val); } } } },
                    scales: { y: { beginAtZero: true, ticks: { callback: function(val) { return '$' + (val/1000).toFixed(0) + 'k'; } } } }
                }
            });
        }

        function initStackedTrendChart() {
            const ctx = document.getElementById('stacked-trend-chart');
            if(!ctx) return;

            const allMonths = getAvailableMonths();
            let last6Months = allMonths.slice(-6);
            if (last6Months.length === 0) last6Months = [globalSelectedMonth];

            const totalExpCats = {};

                }
            });
            const top5Cats = Object.entries(totalExpCats).sort((a,b) => b[1] - a[1]).slice(0, 5).map(c => c[0]);

            const datasets = top5Cats.map((cat, i) => {
                return {
                    label: cat, backgroundColor: chartColors[i % chartColors.length],
                    data: last6Months.map(m => {
                        return currentState.transactions.filter(t => (t.date || '').startsWith(m) && t.type === 'Expense' && t.category === cat).reduce((s, t) => s + t.amount, 0);

            datasets.push({
                label: 'Other', backgroundColor: '#cbd5e1',
                data: last6Months.map(m => {
                    return currentState.transactions.filter(t => (t.date || '').startsWith(m) && t.type === 'Expense' && !top5Cats.includes(t.category)).reduce((s, t) => s + t.amount, 0);

            });
        }

        function renderSankeyDiagramSVGForReport() {
            const container = document.getElementById('report-sankey-container');
            if(!container) return;
            const txForMonth = currentState.transactions.filter(t => (t.date || '').startsWith(globalSelectedMonth));
            
            const incTx = txForMonth.filter(t => t.type === 'Income');
            const totalInc = incTx.reduce((sum, t) => sum + t.amount, 0);
            const incCats = {}; incTx.forEach(t => { incCats[t.category] = (incCats[t.category] || 0) + t.amount; });
            let inflows = Object.entries(incCats).map(([name, amount], idx) => ({ name, amount, color: chartColors[idx % chartColors.length] })).sort((a, b) => b.amount - a.amount);
            if (inflows.length === 0 && totalInc > 0) inflows.push({ name: 'General Income', amount: totalInc, color: '#10b981' });

            const expTx = txForMonth.filter(t => t.type === 'Expense');
            const totalExp = expTx.reduce((sum, t) => sum + t.amount, 0);
            const expCats = {}; expTx.forEach(t => { expCats[t.category] = (expCats[t.category] || 0) + t.amount; });
            let outflows = Object.entries(expCats).map(([name, amount], idx) => ({ name, amount, color: chartColors[(idx + 2) % chartColors.length] })).sort((a, b) => b.amount - a.amount);
            let savingsAmt = totalInc - totalExp;
            if (savingsAmt > 0) outflows.unshift({ name: 'Remaining / Savings', amount: savingsAmt, color: '#0d9468' });

            const maxItems = Math.max(inflows.length, outflows.length, 1);
            const totalCanvasWidth = 1100;
            const totalCanvasHeight = Math.max(1200, maxItems * 130 + 200);

            let svgHtml = `<svg viewBox="0 0 ${totalCanvasWidth} ${totalCanvasHeight}" class="w-full h-auto text-slate-800 bg-white">`;

            let curIncY = 120;
            svgHtml += `<text x="50" y="90" font-size="18" font-weight="bold" fill="currentColor">Income Streams (${formatMoney(totalInc)})</text>`;

            inflows.forEach(inf => {
                const nodeHeight = Math.max(40, (inf.amount / Math.max(totalInc, 1)) * 250);
                svgHtml += `<rect x="50" y="${curIncY}" width="30" height="${nodeHeight}" rx="4" fill="${inf.color}"></rect>`;
                svgHtml += `<text x="90" y="${curIncY + (nodeHeight/2) + 4}" font-size="12" font-weight="600" fill="currentColor">${getCategoryEmoji(inf.name)} ${inf.name} (${formatMoney(inf.amount)})</text>`;
                const startY = curIncY + (nodeHeight / 2);
                const curveHeight = Math.max(4, nodeHeight * 0.5);
                svgHtml += `<path d="M 80 ${startY} C 320 ${startY}, 320 ${totalCanvasHeight/2}, 550 ${totalCanvasHeight/2}" fill="none" stroke="${inf.color}" stroke-width="${curveHeight}" stroke-opacity="0.3"></path>`;
                curIncY += nodeHeight + 40;
            });

            const poolHeight = totalCanvasHeight - 200;
            svgHtml += `<rect x="550" y="100" width="35" height="${poolHeight}" rx="6" fill="#064b36" opacity="0.9"></rect>`;
            svgHtml += `<text x="567" y="${100 + poolHeight/2}" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90 567 ${100 + poolHeight/2})">CASH POOL</text>`;

            let curExpY = 120;
            let totalExpPool = Math.max(totalExp + (savingsAmt > 0 ? savingsAmt : 0), 1);
            svgHtml += `<text x="750" y="90" font-size="18" font-weight="bold" fill="currentColor">Expenses & Allocations (${formatMoney(totalExpPool)})</text>`;

            outflows.forEach(out => {
                const nodeHeight = Math.max(40, (out.amount / totalExpPool) * 350);
                svgHtml += `<rect x="750" y="${curExpY}" width="30" height="${nodeHeight}" rx="4" fill="${out.color}"></rect>`;
                svgHtml += `<text x="790" y="${curExpY + (nodeHeight/2) + 4}" font-size="12" font-weight="600" fill="currentColor">${getCategoryEmoji(out.name)} ${out.name} — ${formatMoney(out.amount)}</text>`;
                const endY = curExpY + (nodeHeight / 2);
                const curveHeight = Math.max(4, nodeHeight * 0.5);
                svgHtml += `<path d="M 585 ${totalCanvasHeight/2} C 670 ${totalCanvasHeight/2}, 670 ${endY}, 750 ${endY}" fill="none" stroke="${out.color}" stroke-width="${curveHeight}" stroke-opacity="0.3"></path>`;
                curExpY += nodeHeight + 40;
            });

            svgHtml += `</svg>`;
            container.innerHTML = outflows.length > 0 || inflows.length > 0 ? svgHtml : `<div class="text-center text-slate-400 py-10">No cash flow data for this month.</div>`;
        }

        function renderSankeyDiagramSVG() {
            const container = document.getElementById('sankey-container'); if(!container) return;
            const txForMonth = currentState.transactions.filter(t => (t.date || '').startsWith(globalSelectedMonth));
            const incTx = txForMonth.filter(t => t.type === 'Income'); const totalInc = incTx.reduce((sum, t) => sum + t.amount, 0); const incCats = {}; incTx.forEach(t => { incCats[t.category] = (incCats[t.category] || 0) + t.amount; });
            let inflows = Object.entries(incCats).map(([name, amount], idx) => ({ name, amount, color: chartColors[idx % chartColors.length] })).sort((a, b) => b.amount - a.amount);
            if (inflows.length === 0 && totalInc > 0) inflows.push({ name: 'General Income', amount: totalInc, color: '#10b981' });

            const expTx = txForMonth.filter(t => t.type === 'Expense'); const totalExp = expTx.reduce((sum, t) => sum + t.amount, 0); const expCats = {}; expTx.forEach(t => { expCats[t.category] = (expCats[t.category] || 0) + t.amount; });
            let outflows = Object.entries(expCats).map(([name, amount], idx) => ({ name, amount, color: chartColors[(idx + 2) % chartColors.length] })).sort((a, b) => b.amount - a.amount);
            let savingsAmt = totalInc - totalExp; if (savingsAmt > 0) outflows.unshift({ name: 'Remaining / Savings', amount: savingsAmt, color: '#0d9468' });

            const maxItems = Math.max(inflows.length, outflows.length, 1);
            const totalCanvasWidth = 1300; const totalCanvasHeight = Math.max(1500, maxItems * 150 + 280); container.style.minHeight = totalCanvasHeight + 'px';

            let svgHtml = `<svg id="sankey-svg" viewBox="0 0 ${totalCanvasWidth} ${totalCanvasHeight}" class="w-full h-full text-slate-700 dark:text-slate-200 bg-white dark:bg-forest-900">`;
            svgHtml += `<text x="60" y="70" font-size="22" font-weight="bold" fill="currentColor">${formatMonthString(globalSelectedMonth)} Cash Flow Diagram</text><text x="60" y="95" font-size="13" fill="#64748b">Total Income: ${formatMoney(totalInc)} • Total Expenses & Savings: ${formatMoney(totalExp + Math.max(0, savingsAmt))}</text>`;

            let curIncY = 160; svgHtml += `<text x="60" y="145" font-size="15" font-weight="bold" fill="currentColor">📥 Income Streams (${formatMoney(totalInc)})</text>`;
            inflows.forEach(inf => {

                const startY = curIncY + (nodeHeight / 2); const curveHeight = Math.max(6, nodeHeight * 0.6);
                svgHtml += `<path d="M 96 ${startY} C 360 ${startY}, 360 ${totalCanvasHeight/2}, 600 ${totalCanvasHeight/2}" fill="none" stroke="${inf.color}" stroke-width="${curveHeight}" stroke-opacity="0.35"></path>`; curIncY += nodeHeight + 50;
            });

            const poolHeight = totalCanvasHeight - 280;
            svgHtml += `<rect x="600" y="140" width="40" height="${poolHeight}" rx="8" fill="#064b36" opacity="0.95"></rect><text x="620" y="${140 + poolHeight/2}" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90 620 ${140 + poolHeight/2})">TOTAL CASH POOL</text>`;

            let curExpY = 160; let totalExpPool = Math.max(totalExp + (savingsAmt > 0 ? savingsAmt : 0), 1); svgHtml += `<text x="900" y="145" font-size="15" font-weight="bold" fill="currentColor">📤 Expenses & Allocations (${formatMoney(totalExpPool)})</text>`;
            outflows.forEach(out => {
                const nodeHeight = Math.max(50, (out.amount / totalExpPool) * 450);
                svgHtml += `<rect x="900" y="${curExpY}" width="36" height="${nodeHeight}" rx="6" fill="${out.color}" opacity="0.95"></rect><text x="950" y="${curExpY + (nodeHeight/2) + 5}" font-size="13" font-weight="600" fill="currentColor">${getCategoryEmoji(out.name)} ${out.name} — ${formatMoney(out.amount)}</text>`;
                const endY = curExpY + (nodeHeight / 2); const curveHeight = Math.max(6, nodeHeight * 0.6);
                svgHtml += `<path d="M 640 ${totalCanvasHeight/2} C 770 ${totalCanvasHeight/2}, 770 ${endY}, 900 ${endY}" fill="none" stroke="${out.color}" stroke-width="${curveHeight}" stroke-opacity="0.35"></path>`; curExpY += nodeHeight + 50;
            });

        }

        function renderNetWorthPage() {

            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        async function syncGoogleSheet() {
            let url = currentState.googleSheetUrl;
            if (!url) { showToast('Please set a Google Sheet CSV URL first.', 'error'); return; }
            showToast('Syncing with Google Sheets...');
            
            let csvText = '';
            try {
                const response = await fetch(url);
                if (response.ok) { csvText = await response.text(); } else { throw new Error('Direct fetch failed'); }
            } catch (err) {
                try {
                    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
                    const proxyResponse = await fetch(proxyUrl);
                    if (!proxyResponse.ok) throw new Error('Proxy fetch failed');
                    csvText = await proxyResponse.text();
                } catch (proxyErr) {
                    console.error(proxyErr); showToast('Failed to fetch Google Sheet due to browser CORS restrictions. Please check your URL or connection.', 'error'); return;
                }
            }
            parseGoogleSheetCSV(csvText);
        }

        function parseGoogleSheetCSV(csvText) {
            try {
                const cleanText = csvText.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                const lines = cleanText.split('\n').filter(l => l.trim().length > 0);
                if (lines.length < 2) { showToast('Google Sheet CSV appears empty.', 'error'); return; }

                let newAssets = []; let newLiabilities = [];

                for (let i = 1; i < lines.length; i++) {
                    const cols = parseCSVLine(lines[i], ','); if (cols.length < 2) continue;
                    let name = cols[0] || 'Item ' + i; let category = cols[1] || 'General'; let amountStr = cols[2] || cols[3] || '0'; let val = parseFloat(amountStr.replace(/[^0-9.-]/g, '')) || 0;
                    if (val === 0 && cols.length > 3) val = parseFloat(cols[cols.length - 1].replace(/[^0-9.-]/g, '')) || 0;
                    if (name.toLowerCase().includes('mortgage') || name.toLowerCase().includes('loan') || name.toLowerCase().includes('debt') || name.toLowerCase().includes('liability')) { newLiabilities.push({ id: 'gs-liab-' + i, name: name, category: category, balance: Math.abs(val) }); }
                    else if (val > 0 || name.toLowerCase().includes('account') || name.toLowerCase().includes('saving') || name.toLowerCase().includes('home') || name.toLowerCase().includes('cash')) { newAssets.push({ id: 'gs-asset-' + i, name: name, category: category, balance: Math.abs(val) }); }
                }

                if (newAssets.length > 0 || newLiabilities.length > 0) {
                    if (newAssets.length > 0) currentState.assets = newAssets; if (newLiabilities.length > 0) currentState.liabilities = newLiabilities;
                    saveState(); renderApp(); showToast('Successfully synced with Google Sheet!');
                } else { showToast('Parsed CSV but found no valid asset/liability balances.', 'error'); }
            } catch (e) { console.error(e); showToast('Error parsing Google Sheet CSV: ' + e.message, 'error'); }
        }

        }

        function setAiQuery(text) { document.getElementById('ai-natural-query').value = text; runSmartAiQuery(); }

        function runSmartAiQuery(forceQuery = '', isQuiet = false) {
            const rawQuery = (forceQuery || document.getElementById('ai-natural-query').value || '').toLowerCase();
            const query = rawQuery.replace(/[?.,]/g, '');
            if (!query.trim()) { if(!isQuiet) showToast('Please enter a question or select a prompt.', 'error'); return; }
            
            if (!isQuiet && typeof selectedTransactionIds !== 'undefined') {
                selectedTransactionIds.clear();
            }

            currentAiQueryText = rawQuery; hasRunAi = true;

            let targetYear = ''; const yearMatch = query.match(/\b(20\d{2})\b/); if (yearMatch) targetYear = yearMatch[1];
            let targetYyyMm = ''; const monthNames = { 'january':'01', 'february':'02', 'march':'03', 'april':'04', 'may':'05', 'june':'06', 'july':'07', 'august':'08', 'september':'09', 'october':'10', 'november':'11', 'december':'12' };
            for (let m in monthNames) { if (query.includes(m)) { targetYyyMm = `${targetYear || new Date().getFullYear().toString()}-${monthNames[m]}`; break; } }

            const knownAccounts = Array.from(new Set([ ...(currentState.transactions || []).map(t => (t.account || '').trim()), ...(currentState.assets || []).map(a => (a.name || '').trim()), ...(currentState.debts || []).map(d => (d.name || '').trim()) ])).filter(a => a.length > 0);
            let matchedAccount = ''; knownAccounts.sort((a, b) => b.length - a.length);
            for (let acc of knownAccounts) { if (query.includes(acc.toLowerCase())) { matchedAccount = acc; break; } }

            const isAvgMonthly = /\b(avg|average)\b.*\bmonth(ly)?\b|\bmonth(ly)?\b.*\b(avg|average)\b/i.test(query) || /\baverage monthly\b/i.test(query);
            const isTopCat = /\b(top|highest|most|biggest|largest)\b.*\b(category|expense|spending|cost)\b|\bwhere did i spend the most\b/i.test(query);
            const isIncomeQuery = /\b(income|earned|revenue|make|made|salary|dividends?)\b/i.test(query);
            const isExpenseQuery = /\b(spend|spent|spending|expense|expenses|cost|paid|pay|bought)\b/i.test(query);
            const stopWords = ['how', 'much', 'did', 'i', 'spend', 'on', 'my', 'in', 'the', 'a', 'for', 'to', 'from', 'what', 'was', 'total', 'amount', 'is', 'are', 'average', 'avg', 'monthly', 'month', 'top', 'highest', 'most', 'biggest', 'largest', 'category', 'categories', 'where', 'show', 'all', 'transactions', 'account', 'accounts', 'wallet', 'by', 'using', 'with', 'card'];
            let accountKeywords = matchedAccount ? matchedAccount.toLowerCase().split(/\s+/) : [];
            let extractedKeywords = query.split(' ').filter(w => !stopWords.includes(w) && !monthNames[w] && !accountKeywords.includes(w) && !w.match(/\b(20\d{2})\b/) && !/\b(make|earned|income|revenue|spent|spend|spending|cost|pay|paid|bought|expense|expenses|transactions?|accounts?)\b/.test(w)).filter(w => w.length > 2);

            let results = currentState.transactions.filter(t => {
                if (targetYear && !(t.date || '').startsWith(targetYear)) return false;
                if (targetYyyMm && !(t.date || '').startsWith(targetYyyMm)) return false;
                if (matchedAccount && !(t.account || '').toLowerCase().includes(matchedAccount.toLowerCase())) return false;
                if (isIncomeQuery && !isExpenseQuery && t.type !== 'Income') return false;
                if (isExpenseQuery && !isIncomeQuery && t.type !== 'Expense') return false;
                if (extractedKeywords.length > 0) { const searchableText = `${t.category} ${t.title} ${t.note}`.toLowerCase(); return extractedKeywords.some(kw => new RegExp('\\b' + kw + '\\b', 'i').test(searchableText)); }
                return true;
            });

            let totalAmount = results.reduce((sum, t) => sum + Math.abs(t.amount), 0); let count = results.length; let html = '';
            
            if (results.length === 0) {
                html = `<div class="p-4 bg-white dark:bg-forest-900 rounded-2xl border border-mint-200 dark:border-emerald-900/40 text-center"><p class="text-sm text-slate-500 py-4">No matching records found for this query.</p></div>`;
            } else if (isAvgMonthly) {
                const monthlyMap = {}; results.forEach(t => { const m = t.date.substring(0, 7); monthlyMap[m] = (monthlyMap[m] || 0) + Math.abs(t.amount); });
                const activeMonths = Object.keys(monthlyMap).length; const activeAvg = totalAmount / (activeMonths || 1); const fullYearAvg = totalAmount / 12;
                html = `
                    <div class="space-y-4">
                        <div class="p-5 bg-white dark:bg-forest-900 rounded-2xl border border-mint-200 dark:border-emerald-900/40 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div><div class="text-[10px] text-slate-500 uppercase font-semibold tracking-wider">Average Monthly ${isIncomeQuery ? 'Income' : 'Spending'}</div><div class="font-serif text-3xl font-bold ${isIncomeQuery ? 'text-emerald-600' : 'text-slate-900 dark:text-white'} mt-1 tabular-nums">${formatMoney(activeAvg)}<span class="text-sm text-slate-500 font-medium">/mo (Active Months)</span></div>${targetYear ? `<div class="text-xs text-slate-500 mt-1 font-medium">Full 12-Month Average: ${formatMoney(fullYearAvg)}/mo</div>` : ''}</div>
                            <div class="text-right"><div class="text-xs font-semibold text-slate-700 dark:text-slate-300">Total Period Amount: <span class="font-bold tabular-nums">${formatMoney(totalAmount)}</span></div><div class="text-xs font-semibold text-slate-500 mt-1">Months Found: ${activeMonths} | Transactions: ${count}</div></div>
                        </div>
                        <div class="space-y-2 max-h-[350px] overflow-y-auto pr-2">
                            <h4 class="font-bold text-xs text-slate-500 uppercase tracking-wider mb-2 sticky top-0 bg-mint-50 dark:bg-emerald-950/40 py-1">Monthly Breakdown</h4>
                            ${Object.entries(monthlyMap).sort((a, b) => b[0].localeCompare(a[0])).map(([m, amt]) => `<div class="flex justify-between items-center p-3 bg-white dark:bg-forest-900 rounded-xl border border-mint-200 dark:border-emerald-900/30 text-xs"><div class="font-bold text-slate-900 dark:text-white">${formatMonthString(m)}</div><div class="font-bold tabular-nums ${isIncomeQuery ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-900 dark:text-white'}">${formatMoney(amt)}</div></div>`).join('')}
                        </div>
                    </div>
                `;
            } else if (isTopCat) {
                const catMap = {}; results.forEach(t => { catMap[t.category] = (catMap[t.category] || 0) + Math.abs(t.amount); });
                const sortedCats = Object.entries(catMap).sort((a, b) => b[1] - a[1]); const topCat = sortedCats[0];
                html = `
                    <div class="space-y-4">
                        <div class="p-5 bg-gradient-to-br from-emerald-600 to-teal-700 text-white rounded-2xl shadow-lg flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div><div class="text-[10px] text-emerald-200 uppercase font-semibold tracking-wider">Top ${isIncomeQuery ? 'Income Source' : 'Spending Category'}</div><div class="font-serif text-3xl font-bold mt-1">${getCategoryEmoji(topCat[0])} ${topCat[0]}</div><div class="font-serif text-xl font-bold text-emerald-100 mt-1 tabular-nums">${formatMoney(topCat[1])} <span class="text-xs font-medium">total</span></div></div>
                            <div class="text-right"><div class="text-xs font-semibold text-emerald-100">Total Analyzed Amount: <span class="font-bold tabular-nums">${formatMoney(totalAmount)}</span></div><div class="text-xs font-semibold text-emerald-200 mt-1">${((topCat[1]/totalAmount)*100).toFixed(1)}% of total ${isIncomeQuery ? 'income' : 'spending'}</div></div>
                        </div>
                        <div class="space-y-2 max-h-[350px] overflow-y-auto pr-2">
                            <h4 class="font-bold text-xs text-slate-500 uppercase tracking-wider mb-2 sticky top-0 bg-mint-50 dark:bg-emerald-950/40 py-1">Category Ranking</h4>
                            ${sortedCats.map(([cat, amt], idx) => `<div class="flex justify-between items-center p-3 bg-white dark:bg-forest-900 rounded-xl border border-mint-200 dark:border-emerald-900/30 text-xs"><div class="flex items-center gap-2"><span class="font-bold text-slate-400 w-4">${idx + 1}.</span><span class="font-bold text-slate-900 dark:text-white">${getCategoryEmoji(cat)} ${cat}</span></div><div class="text-right"><div class="font-bold tabular-nums ${isIncomeQuery ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-900 dark:text-white'}">${formatMoney(amt)}</div><div class="text-[10px] text-slate-500 font-bold">${((amt/totalAmount)*100).toFixed(1)}%</div></div></div>`).join('')}
                        </div>
                    </div>
                `;
            } else {
                const getAiSortIcon = (key) => {
                    if (aiListSort.key !== key) return '<i data-lucide="chevrons-up-down" class="w-3 h-3 inline opacity-40"></i>';
                    return aiListSort.dir === 'asc' ? '<i data-lucide="chevron-up" class="w-3 h-3 inline"></i>' : '<i data-lucide="chevron-down" class="w-3 h-3 inline"></i>';
                };
                const sortedResults = sortTransactionsList(results, aiListSort);
                html = `
                    <div class="space-y-4">
                        <div class="p-4 bg-white dark:bg-forest-900 rounded-2xl border border-mint-200 dark:border-emerald-900/40">
                            <div class="text-xs text-slate-500 uppercase font-semibold">Query Interpretation</div>
                            <div class="font-bold text-slate-900 dark:text-white text-sm mt-1">${isIncomeQuery && !isExpenseQuery ? '📊 <span class="text-emerald-600">Income Query</span>' : (isExpenseQuery && !isIncomeQuery ? '💸 <span class="text-rose-600">Expense Query</span>' : '🔍 Transaction Search')} ${matchedAccount ? `• Account: <span class="text-emerald-600 font-bold">${matchedAccount}</span>` : ''} ${extractedKeywords.length > 0 ? `• Subject: <span class="text-emerald-600">${extractedKeywords.join(', ')}</span>` : ''} ${targetYyyMm ? `• Period: <span class="text-emerald-600">${formatMonthString(targetYyyMm)}</span>` : (targetYear ? `• Period: <span class="text-emerald-600">${targetYear}</span>` : '')}</div>
                            <div class="mt-3 flex flex-wrap gap-4 text-xs font-semibold"><div class="px-3 py-1.5 bg-mint-50 dark:bg-emerald-950/40 rounded-lg">Records Found: <span class="text-emerald-600 text-sm">${count}</span></div><div class="px-3 py-1.5 bg-mint-50 dark:bg-emerald-950/40 rounded-lg">Total Amount: <span class="text-emerald-600 text-sm tabular-nums">${formatMoney(totalAmount)}</span></div></div>
                        </div>
                        <div class="flex justify-between items-center px-1">
                            <div class="flex gap-2 items-center text-xs font-semibold text-slate-500">
                                <span class="mr-1">Sort by:</span>
                                <button onclick="setAiListSort('date')" class="px-2 py-1 rounded-lg border border-mint-200 dark:border-emerald-900/30 bg-mint-50 dark:bg-emerald-950/40 hover:bg-mint-100 dark:hover:bg-emerald-900 transition flex items-center gap-1">Date ${getAiSortIcon('date')}</button>
                                <button onclick="setAiListSort('account')" class="px-2 py-1 rounded-lg border border-mint-200 dark:border-emerald-900/30 bg-mint-50 dark:bg-emerald-950/40 hover:bg-mint-100 dark:hover:bg-emerald-900 transition flex items-center gap-1">Account ${getAiSortIcon('account')}</button>
                                <button onclick="setAiListSort('amount')" class="px-2 py-1 rounded-lg border border-mint-200 dark:border-emerald-900/30 bg-mint-50 dark:bg-emerald-950/40 hover:bg-mint-100 dark:hover:bg-emerald-900 transition flex items-center gap-1">Amount ${getAiSortIcon('amount')}</button>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="flex items-center gap-1.5">
                                    <input type="checkbox" onchange="selectAllTx(this)" class="rounded border-mint-300 text-emerald-600 focus:ring-emerald-500 bg-white dark:bg-forest-900 dark:border-emerald-800 cursor-pointer">
                                    <span class="text-xs font-semibold text-slate-500">Select All</span>
                                </div>
                                <button onclick="bulkDeleteTransactions()" class="bulk-delete-btn ${selectedTransactionIds.size > 0 ? '' : 'hidden'} px-3 py-1.5 bg-rose-600 text-white rounded-lg text-xs font-semibold shadow hover:bg-rose-700 transition">
                                    Delete (<span class="bulk-delete-count">${selectedTransactionIds.size}</span>)
                                </button>
                            </div>
                        </div>
                        <div class="space-y-2 max-h-[350px] overflow-y-auto pr-2">
                            ${sortedResults.map(t => `
                            <div class="flex justify-between items-center p-3 bg-white dark:bg-forest-900 rounded-xl border border-mint-200 dark:border-emerald-900/30 text-xs hover:border-emerald-300 transition">
                                <div class="flex items-center gap-3">
                                    <input type="checkbox" value="${t.id}" class="tx-checkbox rounded border-mint-300 text-emerald-600 focus:ring-emerald-500 bg-mint-50 dark:bg-emerald-950/40 dark:border-emerald-800 cursor-pointer" ${selectedTransactionIds.has(t.id) ? 'checked' : ''} onchange="toggleTxSelection('${t.id}')">
                                    <div>
                                        <div class="font-bold text-slate-900 dark:text-white flex items-center gap-1.5"><span>${getCategoryEmoji(t.category)}</span> ${t.title || 'Untitled'}</div>
                                        <div class="text-[10px] text-slate-400 mt-0.5">${t.date} • ${t.category} • <span class="font-semibold text-emerald-700 dark:text-emerald-400">${t.account}</span></div>
                                    </div>
                                </div>
                                <div class="flex items-center gap-3">
                                    <div class="font-bold tabular-nums ${t.type === 'Income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-900 dark:text-white'}">${t.type === 'Income' ? '+' : ''}${formatMoney(t.amount)}</div>
                                    <button onclick="openEditTransactionModal('${t.id}')" class="text-emerald-600 dark:text-emerald-400 p-1 hover:bg-emerald-50 dark:hover:bg-emerald-900 rounded transition" title="Edit Record"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                </div>
                            </div>`).join('')}
                        </div>
                    </div>
                `;
            }

            const resultsContainer = document.getElementById('ai-query-results');
            if (resultsContainer) { resultsContainer.innerHTML = html; lucide.createIcons(); if(!isQuiet) showToast(`Analyzed ${count} records successfully!`); }
        }

            const todayStr = new Date().toISOString().split('T')[0];
            
            return `
                <div class="space-y-6">

                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">App Display Name</label>
                                <input type="text" value="${currentState.userName}" class="w-full p-3 bg-mint-50 dark:bg-emerald-950/40 border rounded-xl text-sm" onchange="updateUserName(this.value)">
                            </div>
                        </div>

                        <div class="bg-white dark:bg-forest-900 p-6 rounded-3xl border border-mint-200 dark:border-emerald-900/40 shadow-sm space-y-4">
                            <h3 class="font-serif text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2"><i data-lucide="layout-list" class="w-5 h-5"></i> Sidebar Navigation Tools</h3>
                            <p class="text-xs text-slate-500">Toggle visibility or change the order of the tools in the sidebar.</p>
                            <div class="max-h-[350px] overflow-y-auto pr-2">
                                ${tabsHtml}
                            </div>
                        </div>
                    </div>

                    <!-- Import & Export Data Section (Matching Image 1) -->
                    <div class="bg-white dark:bg-forest-900 p-6 rounded-3xl border border-mint-200 dark:border-emerald-900/40 shadow-sm">
                        <h3 class="font-serif text-xl font-bold flex items-center gap-2 mb-6 text-slate-900 dark:text-white"><i data-lucide="cloud-download" class="w-6 h-6"></i> Import & Export Data</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <!-- Import Transactions -->
                            <div class="bg-mint-50/50 dark:bg-emerald-950/20 p-5 rounded-2xl border border-mint-100 dark:border-emerald-900/30 flex flex-col justify-between">
                                <div>
                                    <h4 class="font-bold text-sm text-slate-900 dark:text-white mb-1">Import Transactions</h4>
                                    <p class="text-xs text-slate-500 mb-6">Upload standard CSV or Bank XLSX files.</p>
                                    <input type="file" id="import-tx-file" accept=".csv,.xls,.xlsx" class="block w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer mb-6">
                                </div>
                                <button onclick="triggerImportTransactions()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold shadow transition">Import Data</button>
                            </div>

                            <!-- Import Net Worth -->
                            <div class="bg-mint-50/50 dark:bg-emerald-950/20 p-5 rounded-2xl border border-mint-100 dark:border-emerald-900/30 flex flex-col justify-between">
                                <div>
                                    <h4 class="font-bold text-sm text-slate-900 dark:text-white mb-1">Import Net Worth</h4>
                                    <p class="text-xs text-slate-500 mb-6">Upload monthly balance snapshots via CSV.</p>
                                    <input type="file" id="import-nw-file" accept=".csv" class="block w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer mb-6">
                                </div>
                                <button onclick="triggerImportNetWorth()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold shadow transition">Import Balances</button>
                            </div>

                            <!-- Export Transactions -->
                            <div class="bg-mint-50/50 dark:bg-emerald-950/20 p-5 rounded-2xl border border-mint-100 dark:border-emerald-900/30 flex flex-col justify-between">
                                <div>
                                    <h4 class="font-bold text-sm text-slate-900 dark:text-white mb-1">Export Transactions</h4>
                                    <p class="text-xs text-slate-500 mb-4">Download a complete Excel record of transactions. Leave dates blank for all.</p>
                                    <div class="space-y-3 mb-6">
                                        <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-1">Start Date (Optional)</label><input type="date" id="export-start-date" class="w-full px-3 py-2 bg-white dark:bg-forest-900 border rounded-lg text-xs text-slate-600 dark:text-slate-300"></div>
                                        <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-1">End Date (Optional)</label><input type="date" id="export-end-date" class="w-full px-3 py-2 bg-white dark:bg-forest-900 border rounded-lg text-xs text-slate-600 dark:text-slate-300"></div>
                                    </div>

                                <button onclick="exportTransactionsToExcel()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold shadow transition">Export to Excel</button>
                            </div>
                        </div>
                    </div>

                    <!-- Targeted Data Reset Controls (Matching Image 1) -->
                    <div class="bg-white dark:bg-forest-900 p-6 rounded-3xl border border-rose-100 dark:border-rose-900/40 shadow-sm">
                        <h3 class="font-serif text-xl font-bold flex items-center gap-2 mb-6 text-rose-600"><i data-lucide="trash-2" class="w-6 h-6"></i> Targeted Data Reset Controls</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <button onclick="clearTargetedData('transactions')" class="flex flex-col items-center justify-center p-6 bg-rose-50 dark:bg-rose-950/30 border border-rose-100 dark:border-rose-900/50 rounded-2xl hover:bg-rose-100 dark:hover:bg-rose-900/50 transition text-rose-600 group">
                                <i data-lucide="receipt" class="w-6 h-6 mb-2 group-hover:scale-110 transition-transform"></i>
                                <span class="text-sm font-bold text-rose-600">Clear All Transactions</span>
                            </button>
                            <button onclick="clearTargetedData('assets')" class="flex flex-col items-center justify-center p-6 bg-rose-50 dark:bg-rose-950/30 border border-rose-100 dark:border-rose-900/50 rounded-2xl hover:bg-rose-100 dark:hover:bg-rose-900/50 transition text-rose-600 group">
                                <i data-lucide="pie-chart" class="w-6 h-6 mb-2 group-hover:scale-110 transition-transform"></i>
                                <span class="text-sm font-bold text-rose-600">Clear Assets & Net Worth</span>
                            </button>
                            <button onclick="clearTargetedData('debts')" class="flex flex-col items-center justify-center p-6 bg-rose-50 dark:bg-rose-950/30 border border-rose-100 dark:border-rose-900/50 rounded-2xl hover:bg-rose-100 dark:hover:bg-rose-900/50 transition text-rose-600 group">
                                <i data-lucide="credit-card" class="w-6 h-6 mb-2 group-hover:scale-110 transition-transform"></i>
                                <span class="text-sm font-bold text-rose-600">Clear All Debts</span>
                            </button>
                        </div>
                    </div>

                    <!-- Backup & Restore Full App State (Matching Image 1) -->
                    <div class="bg-white dark:bg-forest-900 p-6 rounded-3xl border border-mint-200 dark:border-emerald-900/40 shadow-sm">
                        <h3 class="font-serif text-xl font-bold flex items-center gap-2 mb-2 text-slate-900 dark:text-white"><i data-lucide="database" class="w-6 h-6"></i> Backup & Restore Full App State</h3>
                        <p class="text-sm text-slate-500 mb-6">Export your entire financial database as a JSON file, or restore it when loading a new browser session.</p>
                        
                        <div class="flex flex-wrap items-center gap-4">
                            <button onclick="exportData()" class="px-6 py-3 bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 dark:hover:bg-slate-600 text-white rounded-xl text-sm font-semibold shadow flex items-center gap-2 transition">
                                <i data-lucide="download" class="w-4 h-4"></i> Export Backup (JSON)
                            </button>
                            
                            <input type="file" id="restore-json-file" accept=".json" class="hidden" onchange="handleRestoreBackup(event)">
                            <button onclick="document.getElementById('restore-json-file').click()" class="px-6 py-3 bg-indigo-50 dark:bg-indigo-900/30 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 rounded-xl text-sm font-semibold transition flex items-center gap-2 border border-indigo-100 dark:border-indigo-900/50">
                                <i data-lucide="upload" class="w-4 h-4"></i> Restore Backup (JSON)
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Setting Helper Functions ---

        function updateUserName(name) { currentState.userName = name; saveState(); updateUserBranding(); showToast('Profile updated!'); }
        
        function toggleTabVisibility(id) {
            if (currentState.hiddenTabs.includes(id)) {
                currentState.hiddenTabs = currentState.hiddenTabs.filter(t => t !== id);
            } else {
                currentState.hiddenTabs.push(id);
            }
            saveState(); renderApp();
        }

        function moveTabOrder(index, direction) {
            if (direction === -1 && index > 0) {
                const temp = currentState.tabOrder[index];
                currentState.tabOrder[index] = currentState.tabOrder[index - 1];
                currentState.tabOrder[index - 1] = temp;
            } else if (direction === 1 && index < currentState.tabOrder.length - 1) {
                const temp = currentState.tabOrder[index];
                currentState.tabOrder[index] = currentState.tabOrder[index + 1];
                currentState.tabOrder[index + 1] = temp;
            }
            saveState(); renderApp();
        }

        function triggerImportTransactions() {
            const input = document.getElementById('import-tx-file');
            if(input.files && input.files.length > 0) handleCashewFileUpload({target: input});
            else showToast('Please select a CSV or XLSX file first.', 'error');
        }

        function triggerImportNetWorth() {
            const input = document.getElementById('import-nw-file');
            if(input.files && input.files.length > 0) handleNetWorthCSVUpload({target: input});
            else showToast('Please select a CSV file first.', 'error');
        }

        function exportTransactionsToExcel() {
            const startDate = document.getElementById('export-start-date').value;
            const endDate = document.getElementById('export-end-date').value;
            
            let txs = currentState.transactions || [];
            
            if (startDate) txs = txs.filter(t => t.date >= startDate);
            if (endDate) txs = txs.filter(t => t.date <= endDate);
            
            if (txs.length === 0) {
                showToast('No transactions found in this date range.', 'error');
                return;
            }

            try {
                const formattedData = txs.map(t => ({
                    Date: t.date,
                    Description: t.title,
                    Debit: t.type === 'Expense' ? t.amount : '',
                    Credit: t.type === 'Income' ? t.amount : '',
                    Category: t.category
                }));
                const ws = XLSX.utils.json_to_sheet(formattedData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Transactions");
                XLSX.writeFile(wb, `Transactions_Export_${new Date().toISOString().split('T')[0]}.xlsx`);
                showToast('Transactions exported successfully!');
            } catch (err) {
                showToast('Export failed: ' + err.message, 'error');
            }
        }

        function clearTargetedData(target) {
            if (target === 'transactions') {
                if(confirm('Are you sure you want to clear ALL transactions? This cannot be undone unless you have a backup.')) { 
                    currentState.transactions = []; saveState(); showToast('All transactions cleared.'); renderApp(); 
                }
            } else if (target === 'assets') {
                if(confirm('Are you sure you want to clear ALL assets and net worth history?')) { 
                    currentState.assets = []; currentState.netWorthHistory = []; saveState(); showToast('Assets and Net Worth history cleared.'); renderApp(); 
                }
            } else if (target === 'debts') {
                if(confirm('Are you sure you want to clear ALL debts and liabilities?')) { 
                    currentState.debts = []; currentState.liabilities = []; saveState(); showToast('All debts and liabilities cleared.'); renderApp(); 
                }
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentState));
            const downloadAnchorNode = document.createElement('a'); downloadAnchorNode.setAttribute("href", dataStr); downloadAnchorNode.setAttribute("download", "my_financial_life_backup.json");
            document.body.appendChild(downloadAnchorNode); downloadAnchorNode.click(); downloadAnchorNode.remove();
            showToast('Backup JSON downloaded!');
        }

        function handleRestoreBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && typeof parsed === 'object') {
                        // Merge parsed data into current state to preserve missing keys
                        currentState = { ...currentState, ...parsed };
                        saveState(); 
                        loadState(); 
                        renderApp(); 
                        showToast('Backup restored successfully!');
                    } else {
                        throw new Error('Invalid structure');
                    }
                } catch(err) {
                    showToast('Failed to parse JSON backup file.', 'error');
                }
                event.target.value = ''; // Reset input
            };
            reader.readAsText(file);
        }

        // --- Data Import Handlers ---

        function handleCashewFileUpload(event) {
            const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
            if (file.name.endsWith('.xls') || file.name.endsWith('.xlsx')) {
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result); const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0]; const worksheet = workbook.Sheets[firstSheetName];
                        const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' }); processCashewRows(jsonRows);
                    } catch (err) { console.error(err); showToast('Error parsing Excel file: ' + err.message, 'error'); }
                }; reader.readAsArrayBuffer(file);
            } else { reader.onload = function(e) { parseCashewCSVText(e.target.result); }; reader.readAsText(file); }
        }

        function parseCashewCSVText(csvText) {
            try {
                const cleanText = csvText.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n'); const lines = cleanText.split('\n').filter(l => l.trim().length > 0);
                if (lines.length < 2) { showToast('CSV file is empty or missing data rows.', 'error'); return; }
                const firstLine = lines[0]; const delimiter = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : ',';
                const headers = parseCSVLine(firstLine, delimiter).map(h => h.trim().toLowerCase()); const colMap = {}; headers.forEach((h, idx) => { colMap[h] = idx; });
                const getColVal = (cols, possibleNames) => { for (let name of possibleNames) { if (colMap[name] !== undefined && cols[colMap[name]] !== undefined) return cols[colMap[name]].trim(); } return ''; };

                let rawRows = [];
                for (let i = 1; i < lines.length; i++) {
                    const cols = parseCSVLine(lines[i], delimiter); if (cols.length === 0 || cols.every(c => c.trim() === '')) continue;
                    rawRows.push({ account: getColVal(cols, ['account', 'wallet', 'account name']), amount: getColVal(cols, ['amount', 'sum', 'value']), title: getColVal(cols, ['title', 'description', 'payee', 'name', 'memo']), note: getColVal(cols, ['note', 'subcategory name', 'subcategory']), date: getColVal(cols, ['date', 'transaction date', 'date_time']), income: getColVal(cols, ['income', 'is_income']), category: getColVal(cols, ['category name', 'category', 'type', 'sub-category']) });
                }
                processCashewRows(rawRows);
            } catch (err) { console.error(err); showToast('Error parsing CSV: ' + err.message, 'error'); }
        }

        function processCashewRows(rows) {
            let newTransactions = [];
            rows.forEach((rawRow, idx) => {
                const row = {}; for (let key in rawRow) { row[key.trim().toLowerCase()] = rawRow[key]; }
                const categoryStr = String(row.category || row['category name'] || row['sub-category'] || '').trim();
                if (categoryStr.toLowerCase().includes('balance correction')) return;

                const accountStr = String(row.account || row.wallet || '').trim(); const titleStr = String(row.title || row.description || row.payee || '').trim(); const noteStr = String(row.note || row['subcategory name'] || '').trim(); const dateStr = String(row.date || row.date_time || '').trim();
                let rawAmount = 0; let isIncome = false;

                if (row.debit !== undefined && row.debit !== '' && parseFloat(row.debit) > 0) { rawAmount = parseFloat(row.debit); isIncome = false; }
                else if (row.credit !== undefined && row.credit !== '' && parseFloat(row.credit) > 0) { rawAmount = parseFloat(row.credit); isIncome = true; }
                else {
                    const amountRaw = row.amount || row.sum || row.value; const incomeRaw = row.income || row.is_income; rawAmount = parseFloat(String(amountRaw || '0').replace(/[^0-9.-]/g, '')) || 0;
                    if (typeof incomeRaw === 'boolean') isIncome = incomeRaw;
                    else if (String(incomeRaw).toLowerCase() === 'true') isIncome = true;
                    else if (rawAmount > 0 && !['shopping', 'dining', 'gas/electrics', 'groceries', 'bills & fees', 'health & wellbeing'].includes(categoryStr.toLowerCase())) isIncome = true;
                }

                if (rawAmount === 0 && !titleStr) return;
                let formattedDate = normalizeDateString(dateStr); let resolvedTitle = titleStr || noteStr || categoryStr || (isIncome ? 'Income' : 'Transaction');
                newTransactions.push({ id: 'tx-imp-' + idx + '-' + Date.now(), date: formattedDate, account: accountStr || 'Primary Account', title: resolvedTitle, note: noteStr, amount: Math.abs(rawAmount), type: isIncome ? 'Income' : 'Expense', category: categoryStr || (isIncome ? 'Income' : 'Uncategorized') });
            });

            if (newTransactions.length > 0) { currentState.transactions = [...newTransactions, ...currentState.transactions]; saveState(); setLatestMonth(); showToast(`Successfully imported ${newTransactions.length} transactions!`); switchPage('transactions'); } else { showToast('No valid transactions found after filtering corrections.', 'error'); }
        }

        function normalizeDateString(dateStr) {
            if (!dateStr) return ''; let num = Number(dateStr);
            if (!isNaN(num) && num > 20000 && num < 60000) { const excelDate = new Date((num - (25567 + 2)) * 86400 * 1000); if (!isNaN(excelDate.getTime())) return excelDate.toISOString().split('T')[0]; }
            let clean = String(dateStr).trim(); if (clean.match(/^\d{4}-\d{2}-\d{2}/)) return clean.substring(0, 10);
            if (clean.includes('/')) { const parts = clean.split('/'); if (parts.length === 3) { let p0 = parts[0], p1 = parts[1], p2 = parts[2]; if (p0.length === 4) return `${p0}-${p1.padStart(2,'0')}-${p2.padStart(2,'0')}`; if (p2.length === 4) { if (parseInt(p0) > 12) return `${p2}-${p1.padStart(2,'0')}-${p0.padStart(2,'0')}`; return `${p2}-${p0.padStart(2,'0')}-${p1.padStart(2,'0')}`; } } }
            let parsed = new Date(clean); if (!isNaN(parsed.getTime())) return parsed.toISOString().split('T')[0];
            return clean.substring(0, 10) || '';
        }

        function parseCSVLine(text, delimiter = ',') {
            let result = []; let current = ''; let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === delimiter && !inQuotes) { result.push(current.trim()); current = ''; }
                else current += char;
            }
            result.push(current.trim()); return result;
        }

        function handleNetWorthCSVUpload(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader(); reader.onload = function(e) { parseNetWorthCSVText(e.target.result); }; reader.readAsText(file);
        }

        function parseNetWorthCSVText(csvText) {
            try {
                const cleanText = csvText.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n'); const lines = cleanText.split('\n').filter(l => l.trim().length > 0);
                if (lines.length < 2) { showToast('CSV file is empty.', 'error'); return; }
                const delimiter = (lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length ? ';' : ','; const headers = parseCSVLine(lines[0], delimiter).map(h => h.trim());
                
                let monthIdx = 0; let totalIdx = headers.findIndex(h => h.toLowerCase() === 'total'); if (totalIdx === -1) totalIdx = headers.length - 3;
                let newAssets = []; let newHistory = []; let latestRowCols = null;

                for (let i = 1; i < lines.length; i++) {
                    const cols = parseCSVLine(lines[i], delimiter); if (cols.length < 2) continue;
                    let monthVal = cols[monthIdx]; let totalVal = parseFloat((cols[totalIdx] || '0').replace(/[^0-9.-]/g, '')) || 0;
                    if (monthVal && totalVal > 0) { newHistory.push({ month: monthVal, total: totalVal }); latestRowCols = cols; }
                }

                if (latestRowCols) {
                    for (let c = 1; c < headers.length; c++) {
                        let headerName = headers[c]; if (['total', '% change', '$ change'].includes(headerName.toLowerCase())) continue;
                        let val = parseFloat((latestRowCols[c] || '0').replace(/[^0-9.-]/g, '')) || 0;
                        if (val > 0) {
                            let cat = 'Bank';
                            if (headerName.toLowerCase().includes('wcu') || headerName.toLowerCase().includes('mpcu') || headerName.toLowerCase().includes('tcu') || headerName.toLowerCase().includes('pscu')) cat = 'Credit Union';
                            else if (headerName.toLowerCase().includes('trading') || headerName.toLowerCase().includes('schwab') || headerName.toLowerCase().includes('ibkr') || headerName.toLowerCase().includes('shares')) cat = 'Brokerage';
                            else if (headerName.toLowerCase().includes('land') || headerName.toLowerCase().includes('home')) cat = 'Real Estate';
                            newAssets.push({ id: 'nw-asset-' + c, name: headerName, category: cat, balance: val });
                        }
                    }
                }

                if (newHistory.length > 0) { currentState.netWorthHistory = newHistory; if (newAssets.length > 0) currentState.assets = newAssets; saveState(); showToast(`Successfully imported ${newHistory.length} monthly net worth snapshots accurately!`); renderApp(); } else { showToast('Could not find valid month/total columns in CSV.', 'error'); }
            } catch (err) { console.error(err); showToast('Error parsing Net Worth CSV: ' + err.message, 'error'); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons(); loadState(); renderApp();
        });
    </script>
